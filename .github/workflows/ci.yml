name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ubuntu-latest · py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create venv & install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[all]"
      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check src tests
      - name: Tests
        run: .venv/bin/python -m pytest
      - name: Doctor smoke（退出码须 ≤1：0=全就绪 / 1=可用但有缺失）
        run: |
          set +e
          .venv/bin/python -m aisentinel.cli doctor
          code=$?
          echo "doctor exit=$code"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
