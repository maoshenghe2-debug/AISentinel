# AISentinel 标识核验字段白名单（对照《人工智能生成合成内容标识办法》）
#
# 判定契约（docs/08 §4 冻结）：
# - 强字段命中（strong_fields）→ has_label（有标识），无需值提示；
# - 弱字段（fields）命中且值含 value_hints → has_label；
# - 无标识字段但存在重编码 / 编辑痕迹（traces）→ suspected_cleaned（疑似被清理）；
# - 皆无 → no_label（无标识）。
#
# 字段名按「本地名」不区分大小写匹配（xmp:CreatorTool 与 CreatorTool 等价）；
# 匹配源：PNG 文本块 / EXIF / XMP / JPEG COM 注释。

version: "1.0"

groups:
  provider:
    title: 服务提供者标识
    # 强字段：出现即可判定为"有标识"（专用于标识/归属语义）
    strong_fields:
      - ServiceProvider
      - Provider
      - ContentProvider
      - AIGC
      - AI-Generated
      - "AI Generated"
      - Credit
    # 弱字段：需值提示命中（工具名/服务名），避免相机固件 Software 等误报
    fields:
      - Software
      - Artist
      - Copyright
      - CreatorTool
      - Source
      - Owner
      - Comment
      - Description
      - ImageDescription
      - UserComment
    value_hints:
      - "即梦"
      - "豆包"
      - "文心"
      - "通义"
      - "混元"
      - "可灵"
      - "星流"
      - "秒画"
      - "kimi"
      - "deepseek"
      - "midjourney"
      - "dall-e"
      - "dall·e"
      - "stable diffusion"
      - "sdxl"
      - "flux"
      - "firefly"
      - "imagen"
      - "ai生成"
      - "人工智能生成"
      - "aigc"
      - "ai-generated"
      - "generated by ai"

  synthesis:
    title: 生成合成属性
    strong_fields:
      - parameters
      - negative_prompt
      - DigitalSourceType
      - GenerationParams
      - Workflow
      - prompt
    fields:
      - generator
      - Model
      - BatchID
    value_hints:
      - "trainedAlgorithmicMedia"
      - "compositeWithTrainedAlgorithmicMedia"
      - "steps:"
      - "sampler"
      - "cfg scale"
      - "seed:"
      - "stable diffusion"
      - "ai生成"
      - "ai-generated"

  content_id:
    title: 内容编号
    strong_fields:
      - ContentID
      - ContentId
      - content_id
      - InstanceID
      - DocumentID
      - DocID
      - TrackID
      - JobID
      - JobId
    fields:
      - UUID
      - BatchID
      - batch_id
    value_hints: []

# 重编码 / 编辑痕迹（疑似被清理的信号；命中 has_label 时不参与判定优先级）
traces:
  encoder_comments:
    - "CREATOR: gd-jpeg"
    - "LEAD Technologies"
    - "ImageMagick"
    - "Optimized by JPEGmini"
    - "Pixelmator"
    - "Google Inc. (http://www.google.com)"
  editor_tools:
    - "Adobe Photoshop"
    - "Adobe Lightroom"
    - "GIMP"
    - "Snapseed"
    - "美图秀秀"
    - "Meitu"
    - "2345看图王"
    - "Windows 照片"
    - "mspaint"
    - "Paint.NET"
    - "剪映"
    - "CapCut"
