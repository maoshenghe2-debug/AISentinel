[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisentinel"
version = "0.1.0"
description = "AISentinel · 大模型安全评测与 AI 内容鉴别平台（红队评测 / 运行时护栏 / 内容标识核验）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Maosheng He", email = "maoshenghe2@gmail.com" }]
keywords = [
  "llm-security",
  "guardrails",
  "ai-content-labeling",
  "red-team",
  "prompt-injection",
  "owasp-llm-top10",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "jsonschema>=4.20",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
all = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
redteam = ["garak>=0.9"]
ml = ["numpy>=1.26", "scikit-learn>=1.4"]

[project.scripts]
aisentinel = "aisentinel.cli:main"

[project.urls]
Homepage = "https://github.com/maoshenghe2-debug/AISentinel"
Repository = "https://github.com/maoshenghe2-debug/AISentinel"

[tool.hatch.build.targets.wheel]
packages = ["src/aisentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: 慢测试（基准 / 全量评测）",
  "requires_ollama: 需要本机 Ollama 服务",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # 行长限制（中文注释与表格）
  "B008",   # typer.Option(...) 默认值模式属预期用法
  "RUF001", # 中文全角标点（有意使用）
  "RUF002",
  "RUF003",
]
